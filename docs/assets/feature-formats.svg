<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <rect width="560" height="320" rx="14" fill="#0F172A"/>
  <text x="28" y="38" font-size="15" font-weight="700" fill="#F8FAFC">Dynamic Tokens, Metadata &amp; Multi-Format Output</text>
  <text x="28" y="58" font-size="11.5" fill="#94A3B8">Tokenized naming, EXIF/GPS scrubbing, Vision tagging &amp; 10 output formats</text>

  <!-- Token chips -->
  <g font-size="11" font-weight="600">
    <rect x="28" y="84" width="94" height="28" rx="6" fill="#1D4ED8"/>
    <text x="75" y="102" text-anchor="middle" fill="#FFFFFF">[File Name]</text>
    <rect x="130" y="84" width="76" height="28" rx="6" fill="#2563EB"/>
    <text x="168" y="102" text-anchor="middle" fill="#FFFFFF">[Width]</text>
    <rect x="214" y="84" width="76" height="28" rx="6" fill="#2563EB"/>
    <text x="252" y="102" text-anchor="middle" fill="#FFFFFF">[Height]</text>
    <rect x="298" y="84" width="84" height="28" rx="6" fill="#0284C7"/>
    <text x="340" y="102" text-anchor="middle" fill="#FFFFFF">[Counter]</text>
    <rect x="390" y="84" width="142" height="28" rx="6" fill="#7C3AED"/>
    <text x="461" y="102" text-anchor="middle" fill="#FFFFFF">[Classification]</text>
  </g>

  <!-- Output format pills -->
  <text x="28" y="148" font-size="11.5" font-weight="700" fill="#E2E8F0">Supported ImageIO / PDFKit Export Formats</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="28" y="164" width="92" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/><text x="74" y="186" fill="#F8FAFC">PNG / Indexed</text>
    <rect x="130" y="164" width="92" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/><text x="176" y="186" fill="#F8FAFC">JPEG</text>
    <rect x="232" y="164" width="92" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/><text x="278" y="186" fill="#F8FAFC">HEIC</text>
    <rect x="334" y="164" width="92" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/><text x="380" y="186" fill="#F8FAFC">AVIF</text>
    <rect x="436" y="164" width="96" height="36" rx="8" fill="#1E293B" stroke="#38BDF8"/><text x="484" y="186" fill="#F8FAFC">TIFF</text>

    <rect x="28" y="210" width="92" height="36" rx="8" fill="#1E293B" stroke="#A78BFA"/><text x="74" y="232" fill="#F8FAFC">GIF (Anim)</text>
    <rect x="130" y="210" width="92" height="36" rx="8" fill="#1E293B" stroke="#A78BFA"/><text x="176" y="232" fill="#F8FAFC">JPEG 2000</text>
    <rect x="232" y="210" width="92" height="36" rx="8" fill="#1E293B" stroke="#A78BFA"/><text x="278" y="232" fill="#F8FAFC">BMP</text>
    <rect x="334" y="210" width="92" height="36" rx="8" fill="#1E293B" stroke="#A78BFA"/><text x="380" y="232" fill="#F8FAFC">PDF (Multi)</text>
    <rect x="436" y="210" width="96" height="36" rx="8" fill="#1E293B" stroke="#A78BFA"/><text x="484" y="232" fill="#F8FAFC">PSD</text>
  </g>
  <text x="28" y="280" font-size="10.5" fill="#94A3B8">Privacy tools: Remove GPS strips {GPS} while preserving camera {Exif} and {TIFF} tags.</text>
</svg>
