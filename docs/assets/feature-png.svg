<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <rect width="560" height="320" rx="14" fill="#0F172A"/>
  <text x="28" y="38" font-size="15" font-weight="700" fill="#F8FAFC">Clean-Room Indexed PNG Encoder (CZlib)</text>
  <text x="28" y="58" font-size="11.5" fill="#94A3B8">Median-Cut (2–256 colors) • Floyd-Steinberg Dither • Manual PNG Chunks</text>

  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="28" y="92" width="116" height="58" rx="10" fill="#1E293B" stroke="#38BDF8"/>
    <text x="86" y="118" fill="#F8FAFC">RGBA8 sRGB</text>
    <text x="86" y="135" font-size="9.5" fill="#94A3B8">Unpremultiplied</text>

    <rect x="166" y="92" width="116" height="58" rx="10" fill="#1E293B" stroke="#A78BFA"/>
    <text x="224" y="118" fill="#F8FAFC">Median-Cut</text>
    <text x="224" y="135" font-size="9.5" fill="#94A3B8">Speed 1–10 Stride</text>

    <rect x="304" y="92" width="116" height="58" rx="10" fill="#1E293B" stroke="#F472B6"/>
    <text x="362" y="118" fill="#F8FAFC">FS Dither</text>
    <text x="362" y="135" font-size="9.5" fill="#94A3B8">1/2/4/8-bpp Pack</text>

    <rect x="442" y="92" width="90" height="58" rx="10" fill="#1E293B" stroke="#34D399"/>
    <text x="487" y="118" fill="#F8FAFC">zlib -lz</text>
    <text x="487" y="135" font-size="9.5" fill="#94A3B8">Brute Crush</text>
  </g>

  <text x="28" y="190" font-size="12" font-weight="700" fill="#E2E8F0">Assembled PNG Binary Stream (Color Type 3 + CRC-32)</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="28" y="206" width="64" height="44" rx="7" fill="#334155"/>
    <text x="60" y="232" fill="#E2E8F0">89 PNG</text>

    <rect x="98" y="206" width="76" height="44" rx="7" fill="#1D4ED8"/>
    <text x="136" y="232" fill="#FFFFFF">IHDR</text>

    <rect x="180" y="206" width="84" height="44" rx="7" fill="#7C3AED"/>
    <text x="222" y="232" fill="#FFFFFF">PLTE</text>

    <rect x="270" y="206" width="76" height="44" rx="7" fill="#DB2777"/>
    <text x="308" y="232" fill="#FFFFFF">tRNS</text>

    <rect x="352" y="206" width="110" height="44" rx="7" fill="#059669"/>
    <text x="407" y="232" fill="#FFFFFF">IDAT</text>

    <rect x="468" y="206" width="64" height="44" rx="7" fill="#334155"/>
    <text x="500" y="232" fill="#E2E8F0">IEND</text>
  </g>
  <text x="28" y="282" font-size="10.5" fill="#94A3B8">Verifies Color Type 3, adaptive bit-depth (1/2/4/8), optional sRGB stripping, and smallest deflate filter.</text>
</svg>
