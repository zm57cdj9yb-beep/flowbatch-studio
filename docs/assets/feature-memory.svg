<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <rect width="560" height="320" rx="14" fill="#0F172A"/>
  <text x="28" y="38" font-size="15" font-weight="700" fill="#F8FAFC">Dual Metal CIContext Memory Architecture</text>
  <text x="28" y="58" font-size="11.5" fill="#94A3B8">Designed to keep 48MP RAW batch pipelines safe on unified-memory Macs</text>

  <!-- 3 Layer Cards -->
  <rect x="28" y="84" width="504" height="58" rx="10" fill="#1E293B" stroke="#38BDF8"/>
  <text x="44" y="109" font-size="12.5" font-weight="700" fill="#38BDF8">Layer 1: Contact-Sheet Thumbnails (~8 MB for 30 assets)</text>
  <text x="44" y="128" font-size="10.5" fill="#CBD5E1">CGImageSourceCreateThumbnailAtIndex (max 256px) • Embedded RAW JPEG first</text>

  <rect x="28" y="156" width="504" height="58" rx="10" fill="#1E293B" stroke="#A78BFA"/>
  <text x="44" y="181" font-size="12.5" font-weight="700" fill="#A78BFA">Layer 2: Interactive Preview (previewContext → MTKView)</text>
  <text x="44" y="200" font-size="10.5" fill="#CBD5E1">cacheIntermediates: true • CIRAWFilter.scaleFactor (0.25×) • Generation-ID cancel</text>

  <rect x="28" y="228" width="504" height="68" rx="10" fill="#1E293B" stroke="#34D399"/>
  <text x="44" y="253" font-size="12.5" font-weight="700" fill="#34D399">Layer 3: Full-Res Batch Export (exportContext • 512 MB cap)</text>
  <text x="44" y="272" font-size="10.5" fill="#CBD5E1">cacheIntermediates: false • memoryTarget: 512 • autoreleasepool • MemoryPressure abort</text>
  <text x="44" y="287" font-size="10" fill="#94A3B8">Streams directly via writeJPEGRepresentation / writeHEIFRepresentation / writePNGRepresentation</text>
</svg>
