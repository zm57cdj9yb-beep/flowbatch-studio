<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <rect width="560" height="320" rx="14" fill="#0F172A"/>
  <text x="28" y="38" font-size="15" font-weight="700" fill="#F8FAFC">Sandboxed JavaScript Worker (FlowBatchJSWorker)</text>
  <text x="28" y="58" font-size="11.5" fill="#94A3B8">Isolated subprocess • Zero Objective-C/Cocoa exports • 2.0s Watchdog</text>

  <rect x="28" y="92" width="166" height="140" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="111" y="122" font-size="12.5" font-weight="700" text-anchor="middle" fill="#F8FAFC">PipelineRunner</text>
  <text x="111" y="146" font-size="10.5" text-anchor="middle" fill="#94A3B8">Encodes Asset DTO</text>
  <text x="111" y="166" font-size="10.5" text-anchor="middle" fill="#94A3B8">+ User Script</text>
  <rect x="52" y="186" width="118" height="28" rx="6" fill="#0F172A" stroke="#F59E0B"/>
  <text x="111" y="204" font-size="10" font-weight="600" text-anchor="middle" fill="#FBBF24">2.0s Watchdog Timer</text>

  <path d="M 194 140 L 258 140" stroke="#38BDF8" stroke-width="2"/>
  <text x="226" y="131" font-size="9.5" text-anchor="middle" fill="#38BDF8">stdin JSON</text>
  <path d="M 258 184 L 194 184" stroke="#34D399" stroke-width="2"/>
  <text x="226" y="199" font-size="9.5" text-anchor="middle" fill="#34D399">stdout JSON</text>

  <rect x="258" y="92" width="274" height="140" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="395" y="120" font-size="12.5" font-weight="700" text-anchor="middle" fill="#34D399">FlowBatchJSWorker (JSVirtualMachine)</text>
  <text x="278" y="148" font-size="10.5" fill="#E2E8F0">✓ asset.fileName, width, height, dpi, tags</text>
  <text x="278" y="168" font-size="10.5" fill="#E2E8F0">✓ asset.skip(), setOutputName(), console.log()</text>
  <text x="278" y="192" font-size="10.5" fill="#F87171">✕ No FileManager, Process, Network, Cocoa</text>
  <text x="278" y="212" font-size="10.5" fill="#F87171">✕ Infinite loops terminated with SIGTERM</text>

  <rect x="28" y="256" width="504" height="36" rx="8" fill="#1E293B"/>
  <text x="280" y="278" font-size="11" font-family="ui-monospace, SFMono-Regular, monospace" text-anchor="middle" fill="#A5B4FC">function processAsset(asset) { asset.setOutputName(asset.fileName + "_edited"); }</text>
</svg>
