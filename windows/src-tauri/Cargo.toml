[package]
name = "flowbatch-studio-windows"
version = "2.0.0"
description = "FlowBatch Studio — Native Windows 11 & Cross-Platform Node-Based Batch Image Processor"
authors = ["FlowBatch Studio Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "flowbatch_studio_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico"] }
rayon = "1.10"
oxipng = { version = "9", default-features = false, features = ["parallel", "zopfli"] }
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
regex = "1"
dirs = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
